{% if messages %}
<div class="app-messages container-fluid">
  {% for message in messages %}
    <div class="alert alert-{{ message.level_tag }}{% if message.extra_tags %} {{ message.extra_tags }}{% endif %} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
