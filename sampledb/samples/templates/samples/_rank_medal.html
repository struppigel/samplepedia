{% if rank == 1 or rank == 2 or rank == 3 %}
  <span class="badge rank-medal rank-medal-{% if rank == 1 %}gold{% elif rank == 2 %}silver{% else %}bronze{% endif %}{% if size == 'small' %} rank-sm{% endif %}">
    <i class="fas fa-medal"></i> #{{ rank }}
  </span>
{% elif rank %}
  <span class="text-muted rank-number{% if size == 'small' %} rank-sm{% endif %}">#{{ rank }}</span>
{% endif %}
