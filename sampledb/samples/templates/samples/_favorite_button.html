<button class="btn btn-link p-0 favorite-btn"
        data-sha256="{{ sha256 }}"
        data-task-id="{{ task_id }}"
        data-liked="{% if is_liked %}true{% else %}false{% endif %}">
  <span class="like-state{% if is_liked %} is-liked{% endif %}" title="{{ favorite_count }} favorite{{ favorite_count|pluralize }}">
    <i class="{% if is_liked %}fas{% else %}far{% endif %} fa-heart"></i> <span class="favorite-count">{{ favorite_count }}</span>
  </span>
</button>
