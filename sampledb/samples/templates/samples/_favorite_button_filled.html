<button class="btn btn-sm me-2 favorite-btn-filled btn-danger"
        data-sha256="{{ sha256 }}"
        data-task-id="{{ task_id }}"
        data-like-url="{% url 'toggle_like' sha256 task_id %}"
        data-liked="{% if is_liked %}true{% else %}false{% endif %}"
        title="{{ favorite_count }} favorite{{ favorite_count|pluralize }}">
  <i class="{% if is_liked %}fas{% else %}far{% endif %} fa-heart"></i>
  <span class="favorite-count d-none">{{ favorite_count }}</span>
</button>
